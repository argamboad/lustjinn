# Alembic: the schema migrations (≈ EF Core migrations).
#   uv run alembic upgrade head                     apply every migration not yet applied
#   uv run alembic downgrade -1                     undo the last one
#   uv run alembic revision -m "what changes"       start a new migration file
#   uv run alembic current                          which migration the database is at
# The database URL is not in this file: migrations/env.py takes it from the app's settings
# (LUSTJINN_DATABASE_URL, or .env).
[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
file_template = %%(rev)s_%%(slug)s
