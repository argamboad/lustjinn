# The gates, run by GitHub Actions on every pull request into develop/main and on pushes to main.
# The repo is private, so every minute is billed against the account's monthly allowance:
#   - No `push: develop` trigger: develop only moves by merging a PR whose gates already ran.
#   - A new push to a PR cancels that PR's previous run (`concurrency` below).
#   - Every job has a `timeout-minutes`; the default is 6 hours.
#   - Unspecified shells are pinned to `bash -e {0}`.
#   - Deploys run ONLY from "Run workflow" (`deploy` input), never on a push, and only after the
#     gates are green: fire the Render hook, wait until the service reports this commit. Render
#     builds from this repo's branch. Setup: docs/DEPLOYMENT.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after the gates are green (staging deploys from develop)
        type: choice
        default: none
        options: [none, staging, web-staging, both]

permissions:
  contents: read

concurrency:
  # One group per PR; pushes and dispatches each get their own, so they are never cancelled.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash -e {0}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Same uv as the development machine, installed from Astral's pinned release script.
      UV_VERSION: "0.12.22"
    # The database tests need a real Postgres: the same image and port as docker-compose.yml, so
    # the tests' default connection string works here unchanged. The job waits for it to be healthy.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: lustjinn
          POSTGRES_PASSWORD: lustjinn
          POSTGRES_DB: lustjinn
        ports:
          - 5440:5432
        options: >-
          --health-cmd "pg_isready -U lustjinn -d lustjinn"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --locked fails if uv.lock is out of date with pyproject.toml, instead of quietly updating it.
      # uv also installs the Python version pinned in .python-version.
      - name: Sync the environment from uv.lock
        run: uv sync --locked

      # Cheapest first: a lint or format failure reports in seconds.
      - name: ruff check
        run: uv run ruff check

      - name: ruff format
        run: uv run ruff format --check

      - name: pyright (strict)
        run: uv run pyright

      - name: pytest
        run: uv run pytest

  # The web app's gates: format, types, unit tests, and a build that the static site would ship.
  # About a billed minute; it runs beside the Python gates, not after them.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash -e {0}
        working-directory: web
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: prettier
        run: npm run lint

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test

      - name: build
        run: npm run build

  deploy-staging:
    needs: [gates, web]
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["staging", "both"]'), github.event.inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
    steps:
      - name: Staging deploys from develop
        run: |
          if [ "${{ github.ref }}" != "refs/heads/develop" ]; then
            echo "::error::staging deploys from develop — this run is on ${{ github.ref }}."
            exit 1
          fi

      - name: Trigger the Render deploy
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::no RENDER_DEPLOY_HOOK_STAGING secret — nothing to deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Triggered the Render staging deploy."

      # /health reports RENDER_GIT_COMMIT, so "up" is not enough: it must be up with THIS commit.
      # 15 minutes covers a free-tier build plus a cold start.
      - name: Wait until staging serves this commit
        env:
          BASE: ${{ vars.STAGING_BASE_URL }}
          EXPECT: ${{ github.sha }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::no deploy was triggered, nothing to wait for."
            exit 0
          fi
          if [ -z "$BASE" ]; then
            echo "::error::a deploy was triggered but STAGING_BASE_URL is not set — it cannot be verified."
            exit 1
          fi
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            got=$(curl -fsS --max-time 70 "$BASE/health" 2> /dev/null | jq -r '.commit // empty' || true)
            if [ "$got" = "$EXPECT" ]; then
              echo "Staging serves $EXPECT."
              exit 0
            fi
            echo "staging reports '${got:-nothing}', waiting for $EXPECT…"
            sleep 15
          done
          echo "::error::staging did not report $EXPECT within 15 minutes — check the deploy in Render's dashboard."
          exit 1

  # The web app's static site: the same shape as the API's deploy. The build bakes the API's URL
  # in (VITE_API_URL, set in Render's dashboard) and writes the commit to /version.txt, which is
  # what "up with this commit" is read from.
  deploy-web-staging:
    needs: [gates, web]
    if: github.event_name == 'workflow_dispatch' && contains(fromJSON('["web-staging", "both"]'), github.event.inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-web-staging
      cancel-in-progress: true
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_WEB_STAGING }}
    steps:
      - name: Staging deploys from develop
        run: |
          if [ "${{ github.ref }}" != "refs/heads/develop" ]; then
            echo "::error::staging deploys from develop — this run is on ${{ github.ref }}."
            exit 1
          fi

      - name: Trigger the Render deploy
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::no RENDER_DEPLOY_HOOK_WEB_STAGING secret — nothing to deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Triggered the Render deploy of the web app."

      - name: Wait until the site serves this commit
        env:
          BASE: ${{ vars.WEB_STAGING_BASE_URL }}
          EXPECT: ${{ github.sha }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::no deploy was triggered, nothing to wait for."
            exit 0
          fi
          if [ -z "$BASE" ]; then
            echo "::error::a deploy was triggered but WEB_STAGING_BASE_URL is not set — it cannot be verified."
            exit 1
          fi
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            got=$(curl -fsS --max-time 30 "$BASE/version.txt" 2> /dev/null | tr -d '[:space:]' || true)
            if [ "$got" = "$EXPECT" ]; then
              echo "The site serves $EXPECT."
              exit 0
            fi
            echo "the site reports '${got:-nothing}', waiting for $EXPECT…"
            sleep 15
          done
          echo "::error::the site did not report $EXPECT within 15 minutes — check the deploy in Render's dashboard."
          exit 1
