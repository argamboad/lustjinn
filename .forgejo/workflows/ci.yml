# The gates, run by the self-hosted Forgejo (origin) on every push to develop/main and on every pull
# request into them. GitHub is only a mirror: this lives in .forgejo/, which GitHub ignores, so the
# mirror never spends Actions minutes. Conventions shared with the sibling repos:
#   - `ubuntu-latest` is the runner's container image (catthehacker/ubuntu act-24.04 + extras).
#   - Unspecified shells are pinned to GitHub's `bash -e {0}` (Forgejo's default adds pipefail).
#   - No `permissions:` key (Forgejo ignores it), so the job token is treated as able to write:
#     the checkout keeps no credentials.
#   - Deploys run ONLY from "Run workflow" (`deploy` input), never on a push, and only after the
#     gates are green: push the commit to the same branch on GitHub (Render builds from there), fire
#     the Render hook, wait until the service reports this commit. Setup: docs/DEPLOYMENT.md.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after the gates are green (staging deploys from develop)
        type: choice
        default: none
        options: [none, staging]

defaults:
  run:
    shell: bash -e {0}

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # Same uv as the development machine. Installed from Astral's script, not the setup-uv action:
      # the script downloads one pinned release and never calls GitHub's API with a Forgejo token.
      UV_VERSION: "0.12.21"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --locked fails if uv.lock is out of date with pyproject.toml, instead of quietly updating it.
      # uv also installs the Python version pinned in .python-version.
      - name: Sync the environment from uv.lock
        run: uv sync --locked

      # Cheapest first: a lint or format failure reports in seconds.
      - name: ruff check
        run: uv run ruff check

      - name: ruff format
        run: uv run ruff format --check

      - name: pyright (strict)
        run: uv run pyright

      - name: pytest
        run: uv run pytest

  deploy-staging:
    needs: gates
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'staging'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: true
    env:
      HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_STAGING }}
    steps:
      - name: Staging deploys from develop
        run: |
          if [ "${{ github.ref }}" != "refs/heads/develop" ]; then
            echo "::error::staging deploys from develop — this run is on ${{ github.ref }}."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0 # the push to GitHub needs the history, not a shallow tip

      - name: Push develop to the GitHub mirror
        env:
          MIRROR_TOKEN: ${{ secrets.DEPLOY_MIRROR_TOKEN }}
          MIRROR_REPO: ${{ vars.DEPLOY_MIRROR_REPO }}
        run: bash .forgejo/scripts/push-to-github.sh develop

      - name: Trigger the Render deploy
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::no RENDER_DEPLOY_HOOK_STAGING secret — nothing to deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Triggered the Render staging deploy."

      # /health reports RENDER_GIT_COMMIT, so "up" is not enough: it must be up with THIS commit.
      # 15 minutes covers a free-tier build plus a cold start.
      - name: Wait until staging serves this commit
        env:
          BASE: ${{ vars.STAGING_BASE_URL }}
          EXPECT: ${{ github.sha }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::no deploy was triggered, nothing to wait for."
            exit 0
          fi
          if [ -z "$BASE" ]; then
            echo "::error::a deploy was triggered but STAGING_BASE_URL is not set — it cannot be verified."
            exit 1
          fi
          deadline=$((SECONDS + 900))
          while [ "$SECONDS" -lt "$deadline" ]; do
            got=$(curl -fsS --max-time 70 "$BASE/health" 2> /dev/null | jq -r '.commit // empty' || true)
            if [ "$got" = "$EXPECT" ]; then
              echo "Staging serves $EXPECT."
              exit 0
            fi
            echo "staging reports '${got:-nothing}', waiting for $EXPECT…"
            sleep 15
          done
          echo "::error::staging did not report $EXPECT within 15 minutes — check the deploy in Render's dashboard."
          exit 1
