# The gates, run by the self-hosted Forgejo (origin) on every push to develop/main and on every pull
# request into them. GitHub is only a mirror: this lives in .forgejo/, which GitHub ignores, so the
# mirror never spends Actions minutes. Conventions shared with the sibling repos:
#   - `ubuntu-latest` is the runner's container image (catthehacker/ubuntu act-24.04 + extras).
#   - Unspecified shells are pinned to GitHub's `bash -e {0}` (Forgejo's default adds pipefail).
#   - No `permissions:` key (Forgejo ignores it), so the job token is treated as able to write:
#     the checkout keeps no credentials.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

defaults:
  run:
    shell: bash -e {0}

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # Same uv as the development machine. Installed from Astral's script, not the setup-uv action:
      # the script downloads one pinned release and never calls GitHub's API with a Forgejo token.
      UV_VERSION: "0.12.21"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install uv
        run: |
          curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # --locked fails if uv.lock is out of date with pyproject.toml, instead of quietly updating it.
      # uv also installs the Python version pinned in .python-version.
      - name: Sync the environment from uv.lock
        run: uv sync --locked

      # Cheapest first: a lint or format failure reports in seconds.
      - name: ruff check
        run: uv run ruff check

      - name: ruff format
        run: uv run ruff format --check

      - name: pyright (strict)
        run: uv run pyright

      - name: pytest
        run: uv run pytest
