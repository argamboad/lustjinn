# Render blueprint — free-tier staging for the API. Spec: https://render.com/docs/blueprint-spec
# Applied once from the Render dashboard (docs/DEPLOYMENT.md). After that, deploys are driven by
# GitHub Actions: ci.yml with deploy=staging runs the gates, then calls this service's deploy hook.
# A push alone deploys nothing.
#
# Free tier: the service sleeps after ~15 min idle and takes ~30–60 s to wake, and it has no
# persistent disk — nothing may be written to the filesystem (the data lives in Neon, from step 2).
services:
  - type: web
    name: lustjinn-staging
    runtime: python                 # Python from .python-version; uv, because uv.lock exists
    plan: free
    branch: develop
    buildCommand: uv sync --locked --no-dev
    startCommand: uv run --no-sync uvicorn lustjinn.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: "off"        # quoted: bare `off` is a boolean to some YAML parsers
    envVars:
      - key: UV_VERSION
        value: "0.12.22"            # the same uv as development and CI

  # The web app: a static site, which never sleeps, built from web/ with the API's URL baked in.
  # VITE_API_URL is set in the dashboard once the API service has its URL (docs/DEPLOYMENT.md);
  # the API's LUSTJINN_CORS_ORIGINS must then name this site's URL, or the browser is refused.
  - type: web
    name: lustjinn-web-staging
    runtime: static
    branch: develop
    rootDir: web
    buildCommand: npm ci && npm run build && echo "$RENDER_GIT_COMMIT" > build/version.txt
    staticPublishPath: build
    autoDeployTrigger: "off"
    routes:
      - type: rewrite               # a single-page app: every path is index.html
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /service-worker.js
        name: Cache-Control
        value: no-cache
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: VITE_API_URL
        sync: false                 # the API service's URL, set by hand; no default in the cloud
